name: Scheduled News Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *" # first day of each month at 06:00 UTC; adjust as needed

jobs:
  run-newsapi:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Firebase credentials file
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          data = os.environ.get("FIREBASE_SERVICE_ACCOUNT")
          if not data:
              raise SystemExit("FIREBASE_SERVICE_ACCOUNT secret is not configured")

          Path("newstracker-84c7d-firebase-adminsdk-fbsvc-c8b0e70438.json").write_text(data, encoding="utf-8")
          PY

      - name: Run news tracker
        env:
          TARGET_PERSON: ${{ secrets.NEWSAPI_PERSON_OVERRIDE }}
        run: |
          if [ -n "$TARGET_PERSON" ]; then
            python newsapi.py --name "$TARGET_PERSON"
          else
            python newsapi.py
          fi
